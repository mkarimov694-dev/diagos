name: Build DiagOS ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка инструментов
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build nasm binutils \
            debootstrap debian-archive-keyring

      - name: Сборка (cpupass + ISO)
        run: sudo bash build.sh

      - name: Проверка cpupass
        run: ./cpupass

      - name: Сохранить ISO как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: diagos-iso
          path: "*.iso"

      - name: Опубликовать релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.iso"
